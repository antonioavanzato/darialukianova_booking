<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1d1d1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Записи">
<title>Дарья · Записи</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Музыка с Дарьей Лукьяновой">
<meta property="og:description" content="Вокал · фортепиано · сольфеджио · хор. Выберите удобное время — онлайн-запись за минуту.">
<meta property="og:image" content="https://antonioavanzato.github.io/darialukianova_booking/assets/og-image.png">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://antonioavanzato.github.io/darialukianova_booking/assets/og-image.png">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./assets/fonts.css">
<style>
:root{
  --ink:#1d1d1f;--ink-80:rgba(29,29,31,.8);--gray:#86868b;--white:#fff;
  --stone-50:#fafaf9;--stone-100:#f5f5f4;--stone-200:#e7e5e4;
  --line-5:rgba(29,29,31,.05);--line-10:rgba(29,29,31,.10);--line-20:rgba(29,29,31,.20);
  --green:#1a7f37;--red:#b42318;--r:26px;--ease:cubic-bezier(.22,.61,.21,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  color:var(--ink);background:var(--stone-50);font-weight:300;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.005em;
  padding-bottom:env(safe-area-inset-bottom);}
.material-symbols-outlined{font-family:"Material Symbols Outlined";font-weight:normal;font-style:normal;
  line-height:1;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;letter-spacing:normal;
  font-feature-settings:'liga';-webkit-font-feature-settings:'liga';font-variant-ligatures:normal;
  -webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;}
h1,h2,h3{margin:0;font-weight:200;letter-spacing:-.025em;}
button{font:inherit;cursor:pointer;}
input,select{font:inherit;}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:380px;background:var(--white);border:1px solid var(--line-10);
  border-radius:34px;padding:38px 30px;box-shadow:0 30px 60px -40px rgba(0,0,0,.3);}
.login-card .eyebrow{font-size:10px;font-weight:500;letter-spacing:.5em;text-transform:uppercase;color:var(--gray);}
.login-card h1{font-size:28px;font-weight:300;margin:14px 0 26px;}
.fld{margin-bottom:14px;}
.fld label{display:block;font-size:12px;font-weight:500;color:var(--gray);margin-bottom:7px;}
.fld input{width:100%;border:1px solid var(--line-10);border-radius:16px;background:var(--white);
  padding:14px 16px;font-size:15px;transition:.3s var(--ease);}
.fld input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(29,29,31,.06);}
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;padding:14px 24px;border-radius:999px;border:1px solid var(--line-20);
  font-size:14px;font-weight:500;color:var(--ink);background:transparent;transition:.45s var(--ease);}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);transform:translateX(-101%);transition:transform .45s var(--ease);}
.btn.primary{color:var(--white);border-color:var(--ink);}
.btn.primary::before{transform:translateX(0);}
.btn.primary:active{transform:scale(.98);}
.btn.block{width:100%;}
.btn:disabled{opacity:.45;}
.login-err{color:var(--red);font-size:13px;margin-top:12px;min-height:18px;}

/* ---------- APP ---------- */
.app{display:none;max-width:680px;margin:0 auto;padding:0 16px;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(250,250,249,.82);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);padding:calc(env(safe-area-inset-top) + 14px) 4px 12px;
  display:flex;align-items:center;justify-content:space-between;}
.topbar h1{font-size:24px;font-weight:300;}
.topbar .sub{font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--gray);}
.icon-btn{width:42px;height:42px;border-radius:999px;border:1px solid var(--line-10);background:var(--white);
  display:flex;align-items:center;justify-content:center;color:var(--ink);}
.icon-btn .material-symbols-outlined{font-size:20px;}
.icon-btn.alert{border-color:var(--ink);}

.tabs{display:flex;gap:8px;background:var(--white);border:1px solid var(--line-10);border-radius:999px;
  padding:5px;margin:6px 0 18px;position:sticky;top:64px;z-index:20;}
.tab{flex:1;border:none;background:transparent;border-radius:999px;padding:11px;font-size:14px;
  font-weight:500;color:var(--gray);position:relative;transition:.35s var(--ease);}
.tab .badge{position:absolute;top:6px;right:14px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:11px;display:none;align-items:center;justify-content:center;}
.tab.on{background:var(--ink);color:#fff;}
.tab.on .badge{background:#fff;color:var(--ink);}

.view{display:none;}
.view.on{display:block;animation:fade .4s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

.secttl{font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gray);
  margin:22px 4px 12px;}

/* calendar */
.cal{background:var(--white);border:1px solid var(--line-10);border-radius:var(--r);padding:16px;margin-bottom:16px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-head .m{font-size:16px;font-weight:500;}
.cal-nav{width:38px;height:38px;border-radius:999px;border:1px solid var(--line-10);background:var(--white);
  display:flex;align-items:center;justify-content:center;color:var(--ink);}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-dow div{text-align:center;font-size:11px;color:var(--gray);font-weight:500;padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{aspect-ratio:1;border:none;background:transparent;border-radius:14px;font-size:15px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);
  cursor:pointer;transition:.25s var(--ease);position:relative;}
.cal-day.past{color:var(--line-20);}
.cal-day.hasfree{background:var(--stone-100);font-weight:500;}
.cal-day.sel{background:var(--ink);color:#fff;}
.cal-day .dots{display:flex;gap:3px;height:4px;}
.cal-day .dots i{width:4px;height:4px;border-radius:999px;display:block;}
.cal-day .dots i.g{background:var(--green);}
.cal-day .dots i.o{background:#d97706;}
.cal-day .dots i.f{background:var(--line-20);}
.cal-day.sel .dots i.f{background:rgba(255,255,255,.5);}
.cal-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:11px;color:var(--gray);}
.cal-legend i{width:6px;height:6px;border-radius:999px;display:inline-block;margin-right:5px;}

/* booking card */
.bcard{background:var(--white);border:1px solid var(--line-10);border-radius:var(--r);padding:18px;
  margin-bottom:12px;transition:.35s var(--ease);}
.bcard:active{transform:scale(.99);}
.bcard.pending{border-color:var(--ink);}
.bcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.bcard .nm{font-size:18px;font-weight:500;}
.bcard .meta{font-size:13px;color:var(--gray);margin-top:3px;}
.pill{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;
  border-radius:999px;white-space:nowrap;}
.pill.pending{background:var(--ink);color:#fff;}
.pill.confirmed{background:rgba(26,127,55,.12);color:var(--green);}
.pill.cancelled{background:var(--stone-100);color:var(--gray);}
.bcard .when{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--ink-80);}
.bcard .when .material-symbols-outlined{font-size:18px;color:var(--gray);}
.bcard .pkg{margin-top:6px;font-size:13px;color:var(--gray);}

.empty{text-align:center;padding:48px 20px;color:var(--gray);}
.empty .material-symbols-outlined{font-size:42px;opacity:.4;display:block;margin-bottom:10px;}

/* slots */
.slot-form{background:var(--white);border:1px solid var(--line-10);border-radius:var(--r);padding:18px;margin-bottom:18px;}
.slot-form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.slot-form .row3{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.slot-form input,.slot-form select{width:100%;border:1px solid var(--line-10);border-radius:14px;
  padding:12px 14px;font-size:15px;background:var(--white);color:var(--ink);-webkit-text-fill-color:var(--ink);
  min-height:48px;-webkit-appearance:none;appearance:none;text-align:left;}
.slot-form input[type=date],.slot-form input[type=time]{display:block;line-height:1.2;}
.slot-form input::-webkit-date-and-time-value{text-align:left;color:var(--ink);}
.slot-form input::-webkit-datetime-edit,
.slot-form input::-webkit-datetime-edit-fields-wrapper,
.slot-form input::-webkit-datetime-edit-text,
.slot-form input::-webkit-datetime-edit-hour-field,
.slot-form input::-webkit-datetime-edit-minute-field,
.slot-form input::-webkit-datetime-edit-day-field,
.slot-form input::-webkit-datetime-edit-month-field,
.slot-form input::-webkit-datetime-edit-year-field{color:var(--ink);-webkit-text-fill-color:var(--ink);}
.slot-form input:focus,.slot-form select:focus{outline:none;border-color:var(--ink);}
.slot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--white);
  border:1px solid var(--line-10);border-radius:18px;padding:14px 16px;margin-bottom:10px;}
.slot-row.booked{opacity:.55;}
.slot-row .d{font-size:15px;}
.slot-row .t{font-size:13px;color:var(--gray);margin-top:2px;}
.slot-del{width:36px;height:36px;border-radius:999px;border:1px solid var(--line-10);background:var(--white);
  display:flex;align-items:center;justify-content:center;color:var(--red);}
.slot-del .material-symbols-outlined{font-size:18px;}

/* ---------- MODAL ---------- */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .4s var(--ease);backdrop-filter:blur(3px);}
.sheet-back.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--white);
  border-radius:32px 32px 0 0;padding:8px 20px calc(env(safe-area-inset-bottom) + 24px);
  max-height:92vh;overflow-y:auto;transform:translateY(101%);transition:transform .5s var(--ease);
  max-width:680px;margin:0 auto;box-shadow:0 -20px 50px -30px rgba(0,0,0,.4);}
.sheet.show{transform:translateY(0);}
.sheet .grab{width:42px;height:5px;border-radius:999px;background:var(--line-20);margin:8px auto 18px;}
.sheet h2{font-size:24px;font-weight:400;}
.sheet .sub{color:var(--gray);font-size:14px;margin-top:4px;}
.info{margin:18px 0;border-top:1px solid var(--line-10);}
.info .r{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line-10);font-size:15px;}
.info .r .k{color:var(--gray);}
.info .r .v{text-align:right;font-weight:400;}
.info .comment{background:var(--stone-50);border-radius:18px;padding:14px 16px;margin-top:14px;font-size:14px;
  color:var(--ink-80);line-height:1.6;white-space:pre-wrap;}
.contacts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0;}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px;border-radius:20px;
  border:1px solid var(--line-10);background:var(--white);color:var(--ink);text-decoration:none;transition:.3s var(--ease);}
.cbtn:active{transform:scale(.95);}
.cbtn .material-symbols-outlined{font-size:24px;}
.cbtn span.lbl{font-size:11px;color:var(--gray);}
.cbtn.off{opacity:.35;pointer-events:none;}
.sheet-actions{display:flex;gap:10px;margin-top:8px;}
.sheet-actions .btn{flex:1;}
.btn.danger{color:var(--red);border-color:rgba(180,35,24,.3);}
.btn.danger::before{background:var(--red);}
.btn.danger:active{color:#fff;}
.btn.danger:active::before{transform:translateX(0);}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translate(-50%,20px);
  background:var(--ink);color:#fff;padding:13px 22px;border-radius:999px;font-size:14px;z-index:60;
  opacity:0;pointer-events:none;transition:.4s var(--ease);}
.toast.show{opacity:1;transform:translate(-50%,0);}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:999px;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.notif-banner{background:var(--white);border:1px solid var(--ink);border-radius:20px;padding:14px 16px;
  margin-bottom:14px;display:flex;align-items:center;gap:12px;font-size:13px;}
.notif-banner .material-symbols-outlined{font-size:22px;}
.notif-banner .btn{padding:9px 16px;font-size:13px;margin-left:auto;}

/* статистика */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 18px;}
.stat{background:var(--white);border:1px solid var(--line-10);border-radius:22px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;transition:.35s var(--ease);}
.stat .si{width:42px;height:42px;border-radius:999px;background:var(--ink);color:#fff;flex:none;
  display:flex;align-items:center;justify-content:center;}
.stat .si .material-symbols-outlined{font-size:22px;}
.stat .sv{font-size:26px;font-weight:300;line-height:1;letter-spacing:-.02em;}
.stat .sl{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--gray);margin-top:5px;}

/* pull-to-refresh */
.pull-ind{height:0;opacity:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  transition:opacity .2s var(--ease);}
.spin.dark{border-color:rgba(29,29,31,.2);border-top-color:var(--ink);}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="login" id="loginScreen">
  <div class="login-card">
    <span class="eyebrow">Админка · Дарья</span>
    <h1>Вход</h1>
    <div class="fld"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="вы@почта.ру"></div>
    <div class="fld"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn primary block" id="loginBtn">Войти</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div class="app" id="app">
  <div class="topbar">
    <div><div class="sub">Записи</div><h1>Дарья</h1></div>
    <div style="display:flex;gap:8px;">
      <a class="icon-btn" href="https://yplaces.com/" target="_blank" rel="noopener" id="yplacesBtn" title="YPLACES — бронь кабинета"><span class="material-symbols-outlined">storefront</span></a>
      <button class="icon-btn" id="pushBtn" title="Push-уведомления" style="display:none;"><span class="material-symbols-outlined">notifications_off</span></button>
      <button class="icon-btn" id="logoutBtn" title="Выйти"><span class="material-symbols-outlined">logout</span></button>
    </div>
  </div>

  <div id="notifBanner"></div>
  <div class="pull-ind" id="pullInd"><span class="spin dark"></span></div>

  <div class="tabs">
    <button class="tab on" data-tab="calendar">Календарь</button>
    <button class="tab" data-tab="bookings">Заявки<span class="badge" id="pendBadge">0</span></button>
  </div>

  <!-- BOOKINGS -->
  <div class="view" id="view-bookings"><div class="stats" id="stats"></div><div id="bookingsList"></div></div>

  <!-- CALENDAR -->
  <div class="view on" id="view-calendar">
    <div class="cal">
      <div class="cal-head">
        <button class="cal-nav" id="calPrev"><span class="material-symbols-outlined">chevron_left</span></button>
        <div class="m" id="calMonth"></div>
        <button class="cal-nav" id="calNext"><span class="material-symbols-outlined">chevron_right</span></button>
      </div>
      <div class="cal-dow"><div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span><i style="background:var(--green);"></i>подтверждено</span>
        <span><i style="background:#d97706;"></i>ждёт ответа</span>
        <span><i style="background:var(--line-20);"></i>свободный слот</span>
      </div>
    </div>
    <div id="dayPanel" style="display:none;">
      <div class="secttl" id="dayTitle"></div>
      <div class="slot-form">
        <div class="row">
          <input id="sfTime" type="time" value="12:00">
          <select id="sfDur"><option value="50" selected>50 мин</option><option value="75">1 ч 15 мин</option><option value="100">1 ч 40 мин</option></select>
        </div>
        <div class="row3">
          <select id="sfKind"><option value="1" selected>Одинарный слот</option><option value="2">Двойной (два подряд)</option></select>
          <select id="sfRepeat"><option value="1" selected>Только эта дата</option><option value="2">Повторять 2 недели</option><option value="4">Повторять 4 недели</option><option value="8">Повторять 8 недель</option></select>
        </div>
        <button class="btn primary block" id="addSlotBtn" style="margin-top:10px;"><span class="material-symbols-outlined">add</span>Добавить слот</button>
      </div>
      <div id="daySlots"></div>
      <div class="secttl" id="dayBookTtl" style="display:none;">Записи в этот день</div>
      <div id="dayBookings"></div>
    </div>
  </div>
</div>

<!-- ===== CLIENT SHEET ===== -->
<div class="sheet-back" id="sheetBack"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>

<div class="toast" id="toast"></div>


<script>
/* ===================================================================
   Админка на Yandex Cloud: вместо Firebase — свой API (Cloud Function
   + YDB). Живые обновления заменены поллингом раз в 20 секунд.
   ⬇ ПОДСТАВИТЬ URL API Gateway после деплоя (yc/deploy.sh) ⬇
   =================================================================== */
var API_URL = "https://d5dfvqmsv02vbpei383a.uvah0e6r.apigw.yandexcloud.net";

var DOW=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var $=function(s){return document.querySelector(s);};
var bookings=[], slots=[], current=null, pollT=null;
var token = localStorage.getItem("adm_token") || null;

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js").catch(function(e){console.warn("SW",e);});
}

function api(method, path, body){
  return fetch(API_URL+path, {
    method: method,
    headers: Object.assign({"Content-Type":"application/json"},
      token ? {"Authorization":"Bearer "+token} : {}),
    body: body ? JSON.stringify(body) : undefined
  }).then(function(r){
    if(r.status===401 && path.indexOf("/login")<0){ logout(); throw new Error("Сессия истекла — войдите снова"); }
    return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; });
  });
}

/* ---------- AUTH ---------- */
$("#loginBtn").onclick=function(){
  var btn=this, p=$("#password").value, l=$("#email").value;
  $("#loginErr").textContent="";
  btn.disabled=true; var o=btn.innerHTML; btn.innerHTML='<span class="spin"></span>';
  api("POST","/api/login",{login:l,password:p}).then(function(r){
    token=r.token; localStorage.setItem("adm_token", token);
    btn.disabled=false; btn.innerHTML=o;
    showApp();
  }).catch(function(err){
    btn.disabled=false; btn.innerHTML=o;
    $("#loginErr").textContent=err.message;
  });
};
$("#password").addEventListener("keydown",function(ev){ if(ev.key==="Enter") $("#loginBtn").click(); });
$("#logoutBtn").onclick=function(){ if(confirm("Выйти из админки?")) logout(); };
function logout(){
  token=null; localStorage.removeItem("adm_token");
  clearInterval(pollT);
  $("#loginScreen").style.display="flex"; $("#app").style.display="none";
}
function showApp(){
  $("#loginScreen").style.display="none"; $("#app").style.display="block";
  refresh();
  clearInterval(pollT); pollT=setInterval(refresh, 20000);
  initPush();
}
if(token) showApp();

/* ---------- WEB PUSH ---------- */

function b64ToU8(s){
  var pad="=".repeat((4-s.length%4)%4), b=(s+pad).replace(/-/g,"+").replace(/_/g,"/");
  var raw=atob(b), a=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i);
  return a;
}
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function setPushIcon(on){
  var btn=$("#pushBtn"); if(!btn) return;
  btn.style.display=pushSupported()?"flex":"none";
  btn.querySelector(".material-symbols-outlined").textContent = on?"notifications_active":"notifications_off";
  btn.classList.toggle("alert", !!on);
}
function initPush(){
  if(!pushSupported()) return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){ setPushIcon(!!sub); }).catch(function(){});
}
$("#pushBtn").onclick=function(){
  if(!pushSupported()) return;
  navigator.serviceWorker.ready.then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub){
        // отключить
        return api("DELETE","/api/admin/push",{endpoint:sub.endpoint})
          .then(function(){ return sub.unsubscribe(); })
          .then(function(){ setPushIcon(false); });
      }
      return Notification.requestPermission().then(function(perm){
        if(perm!=="granted") throw new Error("Разрешите уведомления в настройках");
        return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC_KEY)});
      }).then(function(newSub){
        var j=newSub.toJSON();
        return api("POST","/api/admin/push",{endpoint:j.endpoint, keys:j.keys});
      }).then(function(){ setPushIcon(true); });
    });
  }).catch(function(e){ alert(e.message||"Не удалось включить уведомления"); });
};

/* ---------- DATA ---------- */
function refresh(){
  return Promise.all([api("GET","/api/admin/bookings"), api("GET","/api/admin/slots")])
    .then(function(r){
      bookings=r[0].map(fromApiBooking); slots=r[1].map(fromApiSlot);
      renderBookings(); renderCal(); renderDay();
    }).catch(function(e){ console.warn(e); });
}
function fromApiBooking(b){
  return { id:b.id, slotId:b.slot_id, slotId2:b.slot_id2||null, direction:b.direction, name:b.name, phone:b.phone,
    telegram:b.telegram, comment:b.comment, status:b.status, package:b.package||b.direction||"",
    price:Number(b.price)||null, durationMin:Number(b.duration_min)||null,
    slotDate:b.slot_date, slotTime:b.slot_time, createdAt:Number(b.created_at)||null };
}
function fromApiSlot(s){
  return { id:s.id, date:s.date, time:s.time, direction:s.direction,
    durationMin:Number(s.duration_min)||50, status:s.status };
}

/* ---------- TABS ---------- */
document.querySelectorAll(".tab").forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
    document.querySelectorAll(".view").forEach(function(x){x.classList.remove("on");});
    t.classList.add("on");
    $("#view-"+t.dataset.tab).classList.add("on");
  };
});

/* ---------- RENDER ---------- */
function renderBookings(){
  var pend = bookings.filter(function(b){return b.status==="pending";});
  var badge=$("#pendBadge");
  badge.textContent=pend.length; badge.style.display = pend.length ? "flex" : "none";
  $("#logoutBtn").classList.toggle("alert", pend.length>0);
  renderStats();
  var el=$("#bookingsList");
  if(!bookings.length){ el.innerHTML='<div class="empty"><span class="material-symbols-outlined">inbox</span>Заявок пока нет</div>'; return; }
  var sorted=bookings.slice().sort(function(a,b){
    var rank={pending:0,confirmed:1,cancelled:2};
    return (rank[a.status]-rank[b.status]) || (b.createdAt||0)-(a.createdAt||0);
  });
  el.innerHTML = sorted.map(function(b){
    return '<div class="bcard '+(b.status==="pending"?"pending":"")+'" onclick="openSheet(\''+b.id+'\')">'+
      '<div class="top"><div><div class="nm">'+esc(b.name)+'</div>'+
      '<div class="meta">'+esc(b.package||"")+(b.price?' · '+b.price+' ₽':'')+'</div></div>'+
      '<span class="pill '+b.status+'">'+statusLbl(b.status)+'</span></div>'+
      '<div class="when"><span class="material-symbols-outlined">event</span>'+fmtSlot(b)+'</div>'+
    '</div>';
  }).join("");
}

function renderStats(){
  var pend = bookings.filter(function(b){return b.status==="pending";}).length;
  var conf = bookings.filter(function(b){return b.status==="confirmed";}).length;
  $("#stats").innerHTML =
    '<div class="stat"><span class="si"><span class="material-symbols-outlined">schedule</span></span>'+
      '<div><div class="sv">'+pend+'</div><div class="sl">Ждут ответа</div></div></div>'+
    '<div class="stat"><span class="si"><span class="material-symbols-outlined">check_circle</span></span>'+
      '<div><div class="sv">'+conf+'</div><div class="sl">Подтверждено</div></div></div>';
}

function slotStatusLbl(s){ return s==="booked"?"занят":s==="hold"?"ожидает подтверждения":"свободен"; }

/* ---------- CALENDAR ---------- */
var calMonth=null, selDate=null;
var MONF=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function todayStr(){ var d=new Date(), p=function(n){return n<10?"0"+n:n;};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function dayInfo(){
  var info={};
  slots.forEach(function(s){ (info[s.date]=info[s.date]||{free:0,g:0,o:0}).free += (s.status==="free"?1:0); });
  bookings.forEach(function(b){
    if(!b.slotDate || b.status==="cancelled") return;
    var i=(info[b.slotDate]=info[b.slotDate]||{free:0,g:0,o:0});
    if(b.status==="confirmed") i.g++; else i.o++;
  });
  return info;
}
function renderCal(){
  if(!calMonth){ var n=new Date(); calMonth=[n.getFullYear(), n.getMonth()]; }
  var y=calMonth[0], m=calMonth[1], info=dayInfo(), today=todayStr();
  $("#calMonth").textContent=MONF[m]+" "+y;
  var startDow=(new Date(y,m,1).getDay()+6)%7;
  var days=new Date(y,m+1,0).getDate();
  var html="", p=function(n){return n<10?"0"+n:n;};
  for(var i=0;i<startDow;i++) html+="<div></div>";
  for(var d=1;d<=days;d++){
    var ds=y+"-"+p(m+1)+"-"+p(d), inf=info[ds];
    var dots="";
    if(inf){
      for(var k=0;k<Math.min(inf.g,3);k++) dots+='<i class="g"></i>';
      for(k=0;k<Math.min(inf.o,3-Math.min(inf.g,3));k++) dots+='<i class="o"></i>';
      if(inf.free && (inf.g+inf.o)<3) dots+='<i class="f"></i>';
    }
    var cls="cal-day"+(ds<today?" past":"")+(inf&&inf.free?" hasfree":"")+(selDate===ds?" sel":"");
    html+='<button class="'+cls+'" data-d="'+ds+'"><span>'+d+'</span><span class="dots">'+dots+'</span></button>';
  }
  $("#calGrid").innerHTML=html;
  $("#calGrid").querySelectorAll(".cal-day").forEach(function(b){
    b.onclick=function(){ selDate=b.dataset.d; renderCal(); renderDay(); };
  });
}
$("#calPrev").onclick=function(){ calMonth=calMonth[1]?[calMonth[0],calMonth[1]-1]:[calMonth[0]-1,11]; renderCal(); };
$("#calNext").onclick=function(){ calMonth=calMonth[1]<11?[calMonth[0],calMonth[1]+1]:[calMonth[0]+1,0]; renderCal(); };

function renderDay(){
  var panel=$("#dayPanel");
  if(!selDate){ panel.style.display="none"; return; }
  panel.style.display="block";
  var dt=parseDate(selDate);
  $("#dayTitle").textContent=DOW[dt.getDay()]+", "+dt.getDate()+" "+MON[dt.getMonth()];
  var ds=slots.filter(function(s){return s.date===selDate;});
  $("#daySlots").innerHTML = ds.length ? ds.map(function(s){
    return '<div class="slot-row '+(s.status!=="free"?"booked":"")+'">'+
      '<div><div class="d">'+s.time+"–"+addMin(s.time,s.durationMin)+'</div>'+
      '<div class="t">'+fmtDur(s.durationMin)+' · '+slotStatusLbl(s.status)+'</div></div>'+
      (s.status==="free"?'<button class="slot-del" onclick="delSlot(\''+s.id+'\')"><span class="material-symbols-outlined">delete</span></button>':'')+
    '</div>';
  }).join("") : '<div class="empty" style="padding:20px;"><span class="material-symbols-outlined">event_busy</span>Слотов на эту дату нет</div>';
  var db=bookings.filter(function(b){return b.slotDate===selDate && b.status!=="cancelled";});
  $("#dayBookTtl").style.display = db.length ? "block" : "none";
  $("#dayBookings").innerHTML = db.map(function(b){
    return '<div class="bcard '+(b.status==="pending"?"pending":"")+'" onclick="openSheet(\''+b.id+'\')">'+
      '<div class="top"><div><div class="nm">'+esc(b.name)+'</div>'+
      '<div class="meta">'+esc(b.package||"")+(b.price?' · '+b.price+' ₽':'')+'</div></div>'+
      '<span class="pill '+b.status+'">'+statusLbl(b.status)+'</span></div>'+
      '<div class="when"><span class="material-symbols-outlined">schedule</span>'+(b.slotTime||"")+'</div>'+
    '</div>';
  }).join("");
}
function addMin(t,m){ var q=String(t).split(":"), x=(+q[0])*60+(+q[1])+(Number(m)||0);
  return ("0"+Math.floor(x/60)).slice(-2)+":"+("0"+(x%60)).slice(-2); }

/* ---------- ADD / DELETE SLOT ---------- */
$("#addSlotBtn").onclick=function(){
  var time=$("#sfTime").value;
  if(!selDate) return toast("Выберите дату в календаре");
  if(!time) return toast("Укажите время");
  var dur=Number($("#sfDur").value), weeks=Number($("#sfRepeat").value);
  var kind=Number($("#sfKind").value);
  var btn=this; btn.disabled=true;
  var req=api("POST","/api/admin/slots",{ date:selDate, time:time, durationMin:dur, repeatWeeks:weeks });
  if(kind===2) req=req.then(function(){
    return api("POST","/api/admin/slots",{ date:selDate, time:addMin(time,dur), durationMin:dur, repeatWeeks:weeks });
  });
  req.then(function(){ toast(kind===2?"Двойной слот добавлен":"Слот добавлен"); return refresh(); })
    .catch(function(e){ toast("Ошибка: "+e.message); })
    .finally(function(){ btn.disabled=false; });
};
window.delSlot=function(id){
  if(!confirm("Удалить слот?")) return;
  api("DELETE","/api/admin/slots/"+id).then(function(){ toast("Слот удалён"); return refresh(); })
    .catch(function(e){ toast("Ошибка: "+e.message); });
};

/* ---------- CLIENT SHEET ---------- */
window.openSheet=function(id){
  var b=bookings.find(function(x){return x.id===id;}); if(!b) return;
  current=b;
  var phoneClean=(b.phone||"").replace(/[^\d+]/g,"");
  var waNum=phoneClean.replace(/[^\d]/g,"");
  var tg=(b.telegram||"").replace(/^@/,"");
  var c='<h2>'+esc(b.name)+'</h2><div class="sub">'+esc(b.package||"")+' · '+statusLbl(b.status)+'</div>'+
    '<div class="contacts">'+
      cbtn(phoneClean?("tel:"+phoneClean):null,"call","Звонок")+
      cbtn(phoneClean?("sms:"+phoneClean):null,"sms","iMessage")+
      cbtn(tg?("tg://resolve?domain="+tg):null,"send","Telegram")+
      cbtn(waNum?("whatsapp://send?phone="+waNum):null,"chat","WhatsApp")+
    '</div>'+
    '<div class="info">'+
      row("Телефон", b.phone||"—")+
      row("Telegram", b.telegram||"—")+
      row("Занятие", b.package||"—")+
      row("Стоимость", b.price?b.price+" ₽":"—")+
      row("Дата и время", fmtSlot(b))+
      row("Создана", fmtDate(b.createdAt))+
    '</div>'+
    (b.comment?'<div class="secttl" style="margin-left:0;">Комментарий клиента</div><div class="comment">'+esc(b.comment)+'</div>':'')+
    '<div class="sheet-actions">'+
      (b.status!=="confirmed"?'<button class="btn primary" onclick="setStatus(\''+b.id+'\',\'confirmed\')"><span class="material-symbols-outlined">check</span>Подтвердить</button>':'')+
      (b.status!=="cancelled"?'<button class="btn danger" onclick="setStatus(\''+b.id+'\',\'cancelled\')"><span class="material-symbols-outlined">close</span>Отменить</button>':'')+
    '</div>'+
    '<button class="btn danger block" style="margin-top:10px;" onclick="delBooking(\''+b.id+'\')"><span class="material-symbols-outlined">delete</span>Удалить запись</button>';
  $("#sheetBody").innerHTML=c;
  $("#sheetBack").classList.add("show"); $("#sheet").classList.add("show");
};
function closeSheet(){ var s=$("#sheet"); s.style.transition=""; s.style.transform=""; $("#sheetBack").classList.remove("show"); s.classList.remove("show"); }
$("#sheetBack").onclick=closeSheet;

/* свайп вниз для закрытия модалки */
(function(){
  var sheet=$("#sheet"), startY=null, dy=0;
  function start(y){ if(sheet.scrollTop>0){ startY=null; return; } startY=y; dy=0; sheet.style.transition="none"; }
  function move(y){ if(startY===null) return; dy=y-startY; if(dy<0) dy=0; sheet.style.transform="translateY("+dy+"px)"; }
  function end(){ if(startY===null) return; sheet.style.transition=""; if(dy>90){ closeSheet(); } else { sheet.style.transform=""; } startY=null; dy=0; }
  sheet.addEventListener("touchstart",function(e){ start(e.touches[0].clientY); },{passive:true});
  sheet.addEventListener("touchmove",function(e){ move(e.touches[0].clientY); },{passive:true});
  sheet.addEventListener("touchend",end);
  sheet.addEventListener("touchcancel",end);
})();

/* pull-to-refresh ленты заявок */
(function(){
  var ind=$("#pullInd"), startY=null, dy=0;
  window.addEventListener("touchstart",function(e){
    if(window.scrollY<=0 && $("#app").style.display!=="none" && !$("#sheet").classList.contains("show")){
      startY=e.touches[0].clientY; dy=0;
    } else startY=null;
  },{passive:true});
  window.addEventListener("touchmove",function(e){
    if(startY===null) return;
    dy=e.touches[0].clientY-startY;
    if(dy>0){ var h=Math.min(dy*0.5,64); ind.style.height=h+"px"; ind.style.opacity=Math.min(h/56,1); }
  },{passive:true});
  window.addEventListener("touchend",function(){
    if(startY===null) return;
    var pulled=dy>110;
    startY=null; dy=0;
    if(pulled){ ind.style.height="44px"; ind.style.opacity="1";
      refresh().then(function(){ toast("Обновлено"); });
      setTimeout(function(){ ind.style.height="0px"; ind.style.opacity="0"; },700);
    } else { ind.style.height="0px"; ind.style.opacity="0"; }
  });
})();

window.setStatus=function(id,status){
  api("PATCH","/api/admin/bookings/"+id,{status:status}).then(function(){
    toast(status==="confirmed"?"Бронь подтверждена":"Бронь отменена");
    closeSheet(); return refresh();
  }).catch(function(e){ toast("Ошибка: "+e.message); });
};
window.delBooking=function(id){
  if(!confirm("Удалить запись безвозвратно?")) return;
  api("PATCH","/api/admin/bookings/"+id,{delete:true}).then(function(){
    toast("Запись удалена"); closeSheet(); return refresh();
  }).catch(function(e){ toast("Ошибка: "+e.message); });
};

/* ---------- helpers ---------- */
function cbtn(href,icon,lbl){
  if(!href) return '<a class="cbtn off"><span class="material-symbols-outlined">'+icon+'</span><span class="lbl">'+lbl+'</span></a>';
  return '<a class="cbtn" href="'+href+'" rel="noopener"><span class="material-symbols-outlined">'+icon+'</span><span class="lbl">'+lbl+'</span></a>';
}
function row(k,v){ return '<div class="r"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>'; }
function statusLbl(s){ return s==="pending"?"Новая":s==="confirmed"?"Подтверждена":"Отменена"; }
function fmtSlot(b){
  if(b.slotDate){ var d=parseDate(b.slotDate); return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' · '+(b.slotTime||''); }
  return "—";
}
function parseDate(s){ var p=String(s).split("-"); return new Date(+p[0],(+p[1]-1),+p[2]); }
function fmtDate(ms){ if(!ms) return "—"; var d=new Date(ms); return d.getDate()+' '+MON[d.getMonth()]+', '+pad(d.getHours())+':'+pad(d.getMinutes()); }
function pad(n){ return n<10?"0"+n:n; }
function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):s; }
function fmtDur(m){ m=Number(m)||50; var h=Math.floor(m/60), mm=m%60; return (h?h+' ч'+(mm?' ':''):'')+(mm?mm+' мин':(h?'':'0 мин')); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var toastT;
function toast(msg){ var t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove("show");},2600); }
</script>
